# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: keepsake
      POSTGRES_PASSWORD: keepsake_dev
      POSTGRES_DB: keepsake
    ports:
      - "5432:5432"
    volumes:
      - keepsake_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keepsake -d keepsake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keepsake_pg:
